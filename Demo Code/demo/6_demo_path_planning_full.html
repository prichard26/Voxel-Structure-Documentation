<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo 5: Path Planning</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div id="webgl"></div>

    <div id="title" style="
        position: absolute;
        top: 10px;
        left: 10px;
        font-size: 20px;
        font-weight: bold;
        color: white;
        font-family: Arial, sans-serif;
        background: rgba(0, 0, 0, 0.5);
        padding: 5px 10px;
        border-radius: 5px;">
        Demo 5: Path Planning
    </div>
 
    <script type="module">
        import * as THREE from "../three/build/three.module.min.js";

        import { setupGUI } from "../js/GUI/gui_demo6.js";
        import { THREERobot } from "../js/robot.js";
        import { initScene, scene } from "../js/scene.js";
        import { Voxel } from "../js/voxel.js";

        // Initialize the scene
        initScene();

        
        const sceneSize = 10;  // Grid size in XY
        const maxHeight = 5;   // Max height in Z
        const towerDensity = 0.3;  // Probability of placing a tower

        // Generate the base layer (10x10 grid at z=0), avoiding (0,0,0) and (1,0,0)
        for (let x = -sceneSize; x <= sceneSize; x += 2) {  
            for (let y = -sceneSize; y <= sceneSize; y += 2) {                
                new Voxel(x, y, 0, scene);  
                new Voxel(x + 1, y, 0, scene);
                new Voxel(x, y + 1, 0, scene);
                new Voxel(x + 1, y + 1, 0, scene);
            }
        }

        // Generate towers, avoiding (0,0,0) and (1,0,0)
        for (let x = -sceneSize; x <= sceneSize; x += 2) {
            for (let y = -sceneSize; y <= sceneSize; y += 2) {
                if ((x === 0 && y === 0) || (x === 1 && y === 0)) continue; // Skip robot space

                if (Math.random() < towerDensity) {  // Place a tower randomly
                    let towerHeight = Math.floor(Math.random() * maxHeight) + 1;
                    for (let z = 0.5; z <= towerHeight; z += 0.5) {  // Start at z=0.5, every 0.5 step
                        new Voxel(x, y, z, scene);
                        new Voxel(x + 1, y, z, scene);
                        new Voxel(x, y + 1, z, scene);
                        new Voxel(x + 1, y + 1, z, scene);
                    }
                }
            }
        }
        

        // Initialize the robot
        const originPos = new THREE.Vector3(0,0,0.5);
        const targetPos = new THREE.Vector3(1, 0,0.5);
        const normal = new THREE.Vector3(0, 0, 1);

        const robot = new THREERobot(
            originPos, targetPos, normal, scene
        );

        // Setup GUI
        setupGUI(robot, scene);

    </script>

</body>
</html>
